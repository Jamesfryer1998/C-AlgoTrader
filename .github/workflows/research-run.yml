name: Research run

# Reruns the deployed research apps on the home server from the data they've already downloaded (--offline: no
# requests to Alpaca, no keys needed), then prints their reports. The same as the Research tab's RUN RESEARCH,
# without the holdout; a study whose first run (with downloads) hasn't happened yet is skipped. Start it from
# the Actions tab, or by pushing to the ops/research-run branch.
on:
  workflow_dispatch:
  push:
    branches: [ops/research-run]

jobs:
  research:
    runs-on: [self-hosted, algo-trader]
    timeout-minutes: 120
    env:
      APP_DIR: /opt/algo-trader/app
    steps:
      - uses: actions/checkout@v4
      - name: Run each study --offline
        run: |
          cd "$APP_DIR"
          for study in timing_stocks; do
            app="${study}_app"
            case "$study" in   # where each keeps the bars its first run downloads
              swing|grid) bars="data/pairs/daily" ;;   # share pairs_app's daily bars
              intraday|momentum) bars="data/$study/minute" ;;
              *) bars="data/$study/daily" ;;
            esac
            if [[ ! -d "$bars" ]]; then echo "$study: no downloads yet, run it from the Research tab first"; continue; fi
            if pgrep -x "$app" > /dev/null; then echo "$app is already running"; continue; fi
            mkdir -p "data/$study"
            nice -n 10 "./build/app/$app" --offline > "data/$study/$study.log" 2>&1 || { tail -30 "data/$study/$study.log"; exit 1; }
          done
      - name: Reports
        run: |
          for study in timing_stocks; do
            echo "===== $study"
            python3 deploy/research_summary.py "$APP_DIR/data/$study/report.json"
          done
