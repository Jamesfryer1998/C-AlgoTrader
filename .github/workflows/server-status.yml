name: Server status

# Reads, never changes: how much data the server holds, the disk, and the research run's progress and report.
# Runs ON the home server (self-hosted runner `algo-trader`). Start it from the Actions tab, or by pushing to
# the ops/server-status branch. Prints nothing from /etc/algo-trader.env (the keys).
on:
  workflow_dispatch:
  push:
    branches: [ops/server-status]

jobs:
  status:
    runs-on: [self-hosted, algo-trader]
    timeout-minutes: 10
    env:
      DATA: /var/lib/algo-trader/data
    steps:
      - uses: actions/checkout@v4
      - name: Disk and data
        run: |
          df -h "$DATA"
          du -sh "$DATA"
          du -sh "$DATA"/* 2>/dev/null | sort -h | tail -15
      - name: Live trader
        run: |
          ps -ww -o pid,lstart,etime,args -C algo_trader_app || echo "trader not running"
          echo "--- data/portfolio.json (TRADE THESE)"; cat "$DATA/portfolio.json" 2>/dev/null || echo "none: config/strategy.json"
          echo; echo "--- the running trader's status"
          for sample in 1 2; do   # twice, 70 seconds apart: each stock's last bar and its strategies' levels
            python3 - "$DATA/live/status.json" <<'PY' || true
          import json, sys
          s = json.load(open(sys.argv[1]))
          print("state", s.get("state"), "updated", s.get("updated_utc"), "run", json.dumps(s.get("run", {})))
          for stock in s.get("stocks", []):
              levels = [(l.get("label"), l.get("lower"), l.get("current"), l.get("upper"), l.get("state"), l.get("ready"))
                        for l in stock.get("strategies", [])]
              print(" ", stock.get("ticker"), stock.get("bar_time") or stock.get("time"), stock.get("price"), levels)
          PY
            if [ "$sample" = 1 ]; then sleep 70; fi
          done
          ls -la --time-style=+%F_%H:%M "$DATA/live" 2>/dev/null | head -20
      - name: Dashboard
        run: |
          echo "--- the Live page's refresh, asked of the running dashboard twice, a minute apart"
          python3 - <<'PY' 2>&1 | tail -60 || true
          import json, time, urllib.request
          BASE = "http://localhost:8050"
          callbacks = json.load(urllib.request.urlopen(BASE + "/_dash-dependencies"))
          live = next(c for c in callbacks if "live-strategies.children" in c["output"])
          for sample in (1, 2):
              body = {"output": live["output"],
                      "outputs": [{"id": o.split(".")[0], "property": o.split(".")[1]} for o in live["output"].strip(".").split("...")],
                      "inputs": [{"id": "fast", "property": "n_intervals", "value": sample},
                                 {"id": "tabs", "property": "active_tab", "value": "live"}],
                      "state": [{"id": "live-sent", "property": "data", "value": None}],
                      "changedPropIds": ["fast.n_intervals"]}
              request = urllib.request.Request(BASE + "/_dash-update-component", data=json.dumps(body).encode(),
                                               headers={"Content-Type": "application/json"})
              try:
                  reply = json.load(urllib.request.urlopen(request))
                  strategies = json.dumps(reply["response"]["live-strategies"]["children"])
                  print("sample", sample, "HTTP OK, strategies part:", len(strategies), "chars")
                  import re
                  print("  numbers:", re.findall(r'\d+\.\d+ < \d+\.\d+ < \d+\.\d+', strategies))
              except urllib.error.HTTPError as error:
                  print("sample", sample, "HTTP", error.code, error.read()[:2000].decode(errors="replace"))
              except Exception as error:
                  print("sample", sample, "failed:", repr(error))
              if sample == 1:
                  time.sleep(65)
          PY
          echo "--- the dashboard's log"
          journalctl -u algo-trader-dashboard --since "-40 min" --no-pager 2>&1 | tail -40 || true
          sudo -n journalctl -u algo-trader-dashboard --since "-40 min" --no-pager 2>&1 | grep -iE "error|traceback|exception" | tail -20 || true
      - name: Research run
        run: |
          cat "$DATA/morning/progress.json" 2>/dev/null || echo "no progress.json"; echo
          tail -40 "$DATA/morning/morning.log" 2>/dev/null || echo "no morning.log"
          ps -ww -o pid,etime,ni,%cpu,%mem,args -C morning_app || true
      - name: Research reports
        run: |
          for study in morning pairs swing intraday timing momentum rebalance grid timing_stocks; do
            echo "===== $study"; cat "$DATA/$study/progress.json" 2>/dev/null || echo "no progress.json"; echo
            python3 deploy/research_summary.py "$DATA/$study/report.json"
            ls -la --time-style=+%H:%M "$DATA/$study" 2>/dev/null | grep -v "^d" || true
            echo "--- $study.log"; tail -25 "$DATA/$study/$study.log" 2>/dev/null || echo "no log"
          done
          ps -ww -o pid,etime,ni,%cpu,args -C timing_app,momentum_app,rebalance_app,grid_app,timing_stocks_app,swing_app,intraday_app,pairs_app || true
